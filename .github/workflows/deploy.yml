- name: Login to Amazon ECR
    run: |
      aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin 566778528156.dkr.ecr.us-east-2.amazonaws.com

    - name: Build and push Docker image
      run: |
        docker buildx build --platform linux/amd64 -t application-tracker -f dockerfile .
        docker tag application-tracker:latest 566778528156.dkr.ecr.us-east-2.amazonaws.com/application-tracker:latest
        docker push 566778528156.dkr.ecr.us-east-2.amazonaws.com/application-tracker:latest

    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 566778528156.dkr.ecr.us-east-2.amazonaws.com
          docker pull 566778528156.dkr.ecr.us-east-2.amazonaws.com/application-tracker:latest
          docker stop $(docker ps -q) || true
          docker run -d -p 8080:8080 \
            -e SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }} \
            -e SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }} \
            -e SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }} \
            -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
            -e JWT_EXPIRATION=86400000 \
            566778528156.dkr.ecr.us-east-2.amazonaws.com/application-tracker:latest